# ==================== SCHEMAS ====================
components:
  schemas:

    FilmeInput:
      required:
        - nome
        - sinopse
      type: object
      properties:
        nome:
          type: string
          example: Matrix
        sinopse:
          type: string
          example: Um hacker descobre a verdade sobre sua realidade
        data_lancamento:
          type: string
          example: '1999-03-31'
        duracao:
          type: string
          example: '02:16:00'
        valor:
          type: string
          example: '19.90'
        avaliacao:
          type: string
          example: '8.7'
        capa:
          type: string
          example: 'https://exemplo.com/capa.jpg'

    SexoInput:
      required:
        - nome
        - sigla
      type: object
      properties:
        nome:
          type: string
          maxLength: 40
          example: Masculino
        sigla:
          type: string
          maxLength: 4
          example: M

    PersonagemInput:
      required:
        - nome
      type: object
      properties:
        nome:
          type: string
          example: Cirilo

    GeneroInput:
      required:
        - nome
      type: object
      properties:
        nome:
          type: string
          example: Ação

    NacionalidadeInput:
      required:
        - nome
      type: object
      properties:
        nome:
          type: string
          maxLength: 50
          example: Brasileiro

    AtividadeInput:
      required:
        - nome
      type: object
      properties:
        nome:
          type: string
          maxLength: 45
          example: Ator