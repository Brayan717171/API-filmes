# ==================== SCHEMAS ====================
components:
  schemas:

    FilmeInput:
      required:
        - nome
        - data_lancamento
        - duracao
        - sinopse
        - valor
        - capa
        - id_classificacao
      type: object
      properties:
        nome:
          type: string
          maxLength: 80
          example: Matrix
        data_lancamento:
          type: string
          example: '1999-03-31'
        duracao:
          type: string
          example: '02:16:00'
        sinopse:
          type: string
          example: Um hacker descobre a verdade sobre sua realidade
        avaliacao:
          type: number
          example: 8.7
        valor:
          type: number
          example: 19.90
        capa:
          type: string
          maxLength: 255
          example: 'https://exemplo.com/capa.jpg'
        id_classificacao:
          type: integer
          example: 1

    SexoInput:
      required:
        - nome
        - sigla
      type: object
      properties:
        nome:
          type: string
          maxLength: 40
          example: Masculino
        sigla:
          type: string
          maxLength: 4
          example: M

    PersonagemInput:
      required:
        - nome
      type: object
      properties:
        nome:
          type: string
          example: Cirilo

    GeneroInput:
      required:
        - nome
      type: object
      properties:
        nome:
          type: string
          example: Ação

    NacionalidadeInput:
      required:
        - nome
      type: object
      properties:
        nome:
          type: string
          maxLength: 50
          example: Brasileiro

    AtividadeInput:
      required:
        - nome
      type: object
      properties:
        nome:
          type: string
          maxLength: 45
          example: Ator

    ClassificacaoInput:
      required:
        - nome
        - sigla
        - descricao
      type: object
      properties:
        nome:
          type: string
          maxLength: 50
          example: Livre
        sigla:
          type: string
          maxLength: 5
          example: L
        descricao:
          type: string
          maxLength: 200
          example: Conteúdo adequado para todas as idades

    PessoaInput:
      required:
        - nome
        - data_nascimento
        - idade
        - id_sexo
      type: object
      properties:
        nome:
          type: string
          maxLength: 50
          example: Brayan
        data_nascimento:
          type: string
          example: '2009-02-23'
        idade:
          type: integer
          example: 17
        id_sexo:
          type: integer
          example: 1