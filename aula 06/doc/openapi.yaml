openapi: 3.0.3
info:
  title: Projeto de Filmes DS2M - SENAI JANDIRA
  description: API destinada ao controle de filmes, personagens, gêneros, nacionalidades e sexo
  termsOfService: http://swagger.io/terms/
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:8080

paths:

  # ==================== FILME ====================
  /v1/senai/locadora/filme:
    post:
      tags:
        - Filme
      summary: Adiciona um novo filme
      description: Adiciona um novo filme no banco de dados
      requestBody:
        description: JSON contendo os dados do novo filme
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmeInput'
        required: true
      responses:
        '201':
          description: Filme criado com sucesso
          content:
            
        '400':
          description: Dados inválidos
      
        '415':
          description: Content-Type inválido
        
        '500':
          description: Erro interno no servidor
         
    get:
      tags:
        - Filme
      summary: Lista todos os filmes
      description: Retorna todos os filmes registrados no sistema
      responses:
        '200':
          description: Listagem realizada com sucesso
          
        '404':
          description: Nenhum filme encontrado
         
        '500':
          description: Erro interno no servidor
          

  /v1/senai/locadora/filme/{id}:
    get:
      tags:
        - Filme
      summary: Busca um filme pelo ID
      description: Retorna um único filme com base no ID informado
      parameters:
        - name: id
          in: path
          description: ID do filme a ser buscado
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Filme encontrado
          
        '400':
          description: ID inválido
          
        '404':
          description: Filme não encontrado
          
        '500':
          description: Erro interno no servidor
         

    put:
      tags:
        - Filme
      summary: Atualiza um filme pelo ID
      description: Localiza e atualiza os dados de um filme pelo ID
      parameters:
        - name: id
          in: path
          description: ID do filme a ser atualizado
          required: true
          schema:
            type: integer
      requestBody:
        description: Dados atualizados do filme
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilmeInput'
        required: true
      responses:
        '200':
          description: Filme atualizado com sucesso
      
        '400':
          description: Dados ou ID inválidos

        '404':
          description: Filme não encontrado
         
        '415':
          description: Content-Type inválido
          
        '500':
          description: Erro interno no servidor
       
    delete:
      tags:
        - Filme
      summary: Exclui um filme pelo ID
      description: Remove um filme do banco de dados pelo ID
      parameters:
        - name: id
          in: path
          description: ID do filme a ser excluído
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Filme excluído com sucesso
        
        '400':
          description: ID inválido
        
        '404':
          description: Filme não encontrado
         
        '500':
          description: Erro interno no servidor
    

